{% extends 'livres/base.html' %}
{% block title %}Supprimer — BiblioTech{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card text-center p-5">
            <div class="mb-3"><i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i></div>
            <h3 class="fw-bold">Confirmer la suppression</h3>
            <p class="text-muted">Êtes-vous sûr de vouloir supprimer le livre :</p>
            <h5 class="text-danger fw-bold">« {{ livre.titre }} »</h5>
            <p class="text-muted small">par {{ livre.auteur }}</p>
            <p class="text-danger small"><i class="bi bi-info-circle me-1"></i>Cette action est irréversible.</p>
            <form method="POST" class="d-flex gap-2 justify-content-center mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash me-1"></i>Oui, supprimer</button>
                <a href="{% url 'liste_livres' %}" class="btn btn-outline-secondary px-4"><i class="bi bi-x me-1"></i>Annuler</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
