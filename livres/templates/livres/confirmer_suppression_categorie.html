{% extends 'livres/base.html' %}
{% block title %}Supprimer catégorie — BiblioTech{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card text-center p-5">
            <div class="mb-3"><i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i></div>
            <h3 class="fw-bold">Supprimer la catégorie</h3>
            <h5 class="text-danger fw-bold">« {{ categorie.nom }} »</h5>
            <p class="text-muted small">Les livres associés ne seront pas supprimés, mais perdront leur catégorie.</p>
            <form method="POST" class="d-flex gap-2 justify-content-center mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash me-1"></i>Supprimer</button>
                <a href="{% url 'liste_categories' %}" class="btn btn-outline-secondary px-4">Annuler</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
