<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — BiblioTech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 50%, #e94560 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 20px; padding: 2.5rem; box-shadow: 0 20px 60px rgba(0,0,0,0.4); max-width: 420px; width: 100%; }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header h1 { font-size: 2rem; font-weight: 900; color: #1a1a2e; }
        .login-header span { color: #e94560; }
        .btn-login { background: linear-gradient(135deg, #1a1a2e, #e94560); border: none; color: white; padding: 0.75rem; font-weight: 600; border-radius: 10px; }
        .btn-login:hover { opacity: 0.9; color: white; }
        .form-control { border-radius: 10px; padding: 0.75rem 1rem; border: 2px solid #eee; }
        .form-control:focus { border-color: #e94560; box-shadow: 0 0 0 0.2rem rgba(233,69,96,0.15); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-book-half" style="font-size: 3rem; color: #e94560;"></i>
            <h1>Biblio<span>Tech</span></h1>
            <p class="text-muted">Connectez-vous pour accéder à votre bibliothèque</p>
        </div>
        {% if form.errors %}
        <div class="alert alert-danger rounded-3"><i class="bi bi-exclamation-circle me-2"></i>Identifiants incorrects.</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Nom d'utilisateur</label>
                <div class="input-group">
                    <span class="input-group-text rounded-start-3"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="admin" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Mot de passe</label>
                <div class="input-group">
                    <span class="input-group-text rounded-start-3"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn btn-login w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
            </button>
        </form>
    </div>
</body>
</html>
